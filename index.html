<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Dhis!</title>
    <style>
        :root {
            --paper-bg: #f8f1e0;
            --card-open-max-width: 850px;
            --card-margin-top: 3vh;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #d1bc96;
            background-image: radial-gradient(#b8a27d 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        #main-stage {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            margin-top: var(--card-margin-top);
            padding: 10px;
        }

        .card-perspective-container {
            position: relative;
            perspective: 2000px;
            width: 100%;
            max-width: var(--card-open-max-width);
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        /* --- COVER CARD --- */
        .card-cover {
            display: block;
            margin: 0 auto;
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s;
            width: 320px;
            max-width: 85vw;
            background-color: var(--paper-bg);
            border-radius: 6px;
            text-align: center;
        }

        .card-cover:hover {
            transform: scale(1.02) rotate(-1deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .card-cover img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }

        .cover-hint {
            padding: 8px;
            font-size: 12px;
            color: #777;
            font-weight: bold;
        }

        /* --- OPEN CARD SPREAD --- */
        .card-spread {
            display: none;
            width: 100%;
            max-width: var(--card-open-max-width);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 8px solid white;
            background-color: var(--paper-bg);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .card-spread.is-open {
            display: flex;
            flex-direction: row;
        }

        @media (max-width: 680px) {
            .card-spread.is-open {
                flex-direction: column;
            }
        }

        .card-page {
            flex: 1;
            position: relative;
            background-color: var(--paper-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 480px;
        }

        .left-page {
            border-right: 1px dashed #ccc;
        }

        /* --- BUTTON TUTUP --- */
        #close-card-btn {
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 10px 22px;
            font-size: 14px;
            font-family: inherit;
            font-weight: bold;
            background-color: #8c6d46;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none;
            transition: background 0.2s;
        }

        #close-card-btn:hover {
            background-color: #705534;
        }

        .card-spread.is-open + #close-card-btn {
            display: block;
        }

        /* --- HALAMAN SURAT & AMPLOP --- */
        .envelope-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .envelope-image {
            width: 85%;
            max-width: 290px;
            height: auto;
            display: block;
            z-index: 10;
        }

        .letter-content {
            width: 80%;
            max-width: 270px;
            height: auto;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: absolute;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            z-index: 5;
            top: 100%;
            left: 50%;
            transform: translate(-50%, 0) scale(0.5);
            opacity: 0;
            pointer-events: none;
        }

        /* Action saat tombol BUKA SURAT diklik */
        .letter-content.letter-open {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 100;
            opacity: 1;
            pointer-events: auto;
        }

        .btn-letter-toggle {
            padding: 10px 22px;
            font-size: 13px;
            font-family: inherit;
            font-weight: bold;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
            z-index: 20;
            margin-bottom: 10px;
        }

        .btn-letter-toggle:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
        }

        /* --- HALAMAN KUE & LILIN --- */
        .cake-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            flex: 1;
        }

        .cake-wrapper {
            position: relative;
            width: 85%;
            max-width: 300px;
        }

        /* Efek nyala/kelap-kelip pada lilin gambar asli */
        .cake-image {
            width: 100%;
            height: auto;
            display: block;
            transition: filter 0.3s ease, transform 0.1s ease;
            filter: drop-shadow(0 0 12px rgba(255, 140, 0, 0.8));
            animation: candleGlow 0.3s infinite alternate;
        }

        @keyframes candleGlow {
            0% { filter: drop-shadow(0 0 8px rgba(255, 120, 0, 0.7)); }
            100% { filter: drop-shadow(0 0 16px rgba(255, 180, 0, 0.9)); }
        }

        /* Tampilan kue saat api padam */
        .cake-image.extinguished {
            animation: none !important;
            filter: grayscale(0.2) brightness(0.9);
        }

        /* KONTROL MIKROFON */
        .controls-panel {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.85);
            padding: 10px 15px;
            border-radius: 8px;
            width: 90%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .meter-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        meter {
            width: 120px;
            height: 12px;
        }

        .btn-action {
            padding: 8px 16px;
            font-size: 12px;
            font-family: inherit;
            border: 1px solid #aaa;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #f0f0f0;
        }

        /* WISH POPUP & CONFETTI */
        #wish-message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 1.5em;
            font-weight: bold;
            color: #d32f2f;
            background: rgba(255,255,255,0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 80;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            width: 80%;
        }

        #wish-message.show-wish {
            transform: translate(-50%, -50%) scale(1);
        }

        canvas#confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 75;
        }
    </style>
</head>
<body>

    <div id="main-stage">
        <div class="card-perspective-container">

            <!-- COVER CARD (Gambar 1) -->
            <div id="card-cover" class="card-cover" onclick="openCard()">
                <div class="cover-hint">✦ klik untuk membuka ✦</div>
                <img id="cover-img" src="https://i.ibb.co.com/QvQn6X6c/1.png" alt="Cover">
            </div>

            <!-- OPEN SPREAD CARD -->
            <div id="card-spread" class="card-spread">
                <!-- HALAMAN KIRI: AMPLOP (Gambar 4) & SURAT (Gambar 3) -->
                <div class="card-page left-page">
                    <div class="envelope-wrapper">
                        <img id="envelope-img" class="envelope-image" src="https://i.ibb.co.com/5W34LD89/4.png" alt="Envelope">
                        <img id="letter-img" class="letter-content" src="https://i.ibb.co.com/JfXvR2x/3.png" alt="Letter" onclick="toggleLetter()">
                    </div>
                    <button id="toggle-letter-btn" class="btn-letter-toggle" onclick="toggleLetter()">BUKA SURAT ✉️</button>
                </div>

                <!-- HALAMAN KANAN: KUE (Gambar 2) -->
                <div class="card-page right-page">
                    <canvas id="confetti"></canvas>
                    <div id="wish-message">Make a wish, Dhis! ✨</div>

                    <div class="cake-container">
                        <div class="cake-wrapper">
                            <img id="cake-img" class="cake-image" src="https://i.ibb.co.com/Qv1095FW/2.png" alt="Cake">
                        </div>

                        <div class="controls-panel">
                            <div class="meter-box">
                                <span>Tiup Mic:</span>
                                <meter id="blow-meter" min="0" max="1" value="0"></meter>
                            </div>
                            <button id="fallback-btn" class="btn-action" onmousedown="startManualBlow()" onmouseup="endManualBlow()" ontouchstart="startManualBlow()" ontouchend="endManualBlow()">Tahan untuk Meniup 💨</button>
                            <button id="relight-btn" class="btn-action" onclick="relightCandles()" style="display:none;">Nyalakan Lagi 🕯️</button>
                        </div>
                    </div>
                </div>
            </div>

            <button id="close-card-btn" onclick="closeCard()">Tutup Kartu ↩</button>

        </div>
    </div>

    <script>
        let isCardOpen = false;
        let isLetterOpen = false;
        let audioContext = null;
        let analyser = null;
        let micStream = null;
        let blowTimeout = null;
        let areCandlesOut = false;
        let isManualBlowing = false;

        function openCard() {
            document.getElementById('card-cover').style.display = 'none';
            document.getElementById('card-spread').classList.add('is-open');
            isCardOpen = true;
            initAudio();
        }

        function closeCard() {
            document.getElementById('card-cover').style.display = 'block';
            document.getElementById('card-spread').classList.remove('is-open');
            isCardOpen = false;
            if (isLetterOpen) toggleLetter();
        }

        function toggleLetter() {
            if (!isCardOpen) return;
            isLetterOpen = !isLetterOpen;
            const letter = document.getElementById('letter-img');
            const btn = document.getElementById('toggle-letter-btn');
            
            if (isLetterOpen) {
                letter.classList.add('letter-open');
                btn.textContent = "TUTUP SURAT 📩";
            } else {
                letter.classList.remove('letter-open');
                btn.textContent = "BUKA SURAT ✉️";
            }
        }

        // WEB AUDIO API
        async function initAudio() {
            if (areCandlesOut) return;
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(micStream);
                source.connect(analyser);
                listenAudio();
            } catch (e) {
                console.log("Mic ditolak atau tidak disupport.");
            }
        }

        function listenAudio() {
            if (!isCardOpen || !analyser || areCandlesOut) return;
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i];
            const average = sum / data.length / 128.0;

            document.getElementById('blow-meter').value = average;

            if (average > 0.4 && !isManualBlowing) {
                animateCakeBlowing(true);
                startBlowTimer();
            } else if (!isManualBlowing) {
                animateCakeBlowing(false);
                cancelBlowTimer();
            }
            requestAnimationFrame(listenAudio);
        }

        function startManualBlow() {
            if (areCandlesOut) return;
            isManualBlowing = true;
            document.getElementById('blow-meter').value = 1.0;
            animateCakeBlowing(true);
            startBlowTimer();
        }

        function endManualBlow() {
            if (areCandlesOut || !isManualBlowing) return;
            isManualBlowing = false;
            document.getElementById('blow-meter').value = 0;
            animateCakeBlowing(false);
            cancelBlowTimer();
        }

        function animateCakeBlowing(isBlowing) {
            const cake = document.getElementById('cake-img');
            if (isBlowing && !areCandlesOut) {
                cake.style.transform = 'scale(0.98) skewX(-2deg)';
            } else if (!areCandlesOut) {
                cake.style.transform = 'scale(1) skewX(0deg)';
            }
        }

        function startBlowTimer() {
            if (!blowTimeout) {
                blowTimeout = setTimeout(extinguish, 500);
            }
        }

        function cancelBlowTimer() {
            if (blowTimeout) {
                clearTimeout(blowTimeout);
                blowTimeout = null;
            }
        }

        function extinguish() {
            areCandlesOut = true;
            cancelBlowTimer();
            const cake = document.getElementById('cake-img');
            cake.classList.add('extinguished');
            cake.style.transform = 'scale(1) skewX(0deg)';

            document.getElementById('wish-message').classList.add('show-wish');
            document.getElementById('fallback-btn').style.display = 'none';
            document.getElementById('relight-btn').style.display = 'block';
            startConfetti();
        }

        function relightCandles() {
            areCandlesOut = false;
            const cake = document.getElementById('cake-img');
            cake.classList.remove('extinguished');

            document.getElementById('wish-message').classList.remove('show-wish');
            document.getElementById('fallback-btn').style.display = 'block';
            document.getElementById('relight-btn').style.display = 'none';
            stopConfetti();
            initAudio();
        }

        // CONFETTI
        let confettiInterval = null;
        function startConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            const particles = Array.from({length: 60}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                color: ['#f44336','#2196f3','#4caf50','#ffeb3b','#9c27b0'][Math.floor(Math.random()*5)],
                size: Math.random() * 6 + 4,
                speed: Math.random() * 3 + 2
            }));

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.speed;
                    if (p.y > canvas.height) p.y = -10;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
            }
            confettiInterval = setInterval(draw, 20);
        }

        function stopConfetti() {
            clearInterval(confettiInterval);
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
